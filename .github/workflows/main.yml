name: Snake Contribution Generator

on:
  schedule:
    - cron: "0 0 * * *"   # once daily
  workflow_dispatch:

# Prevent race conditions
concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    name: Generate & Deploy Snake Assets
    runs-on: ubuntu-latest

    permissions:
      contents: write   # required ONLY for gh-pages

    env:
      OUTPUT_DIR: dist

    steps:
      # 1. Checkout (read-only usage)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Generate Assets (pure function step)
      - name: Generate Snake Assets
        id: generate
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ env.OUTPUT_DIR }}/snake.svg
            ${{ env.OUTPUT_DIR }}/snake-dark.svg?palette=github-dark
            ${{ env.OUTPUT_DIR }}/snake.gif?color_snake=orange&color_dots=#52BE80,#27AE60,#229954,#1E8449,#196F3D

      # 3. Validate Output (defensive programming)
      - name: Validate Generated Files
        run: |
          set -e
          if [ ! -d "${OUTPUT_DIR}" ]; then
            echo "Output directory missing"
            exit 1
          fi

          file_count=$(ls -1 ${OUTPUT_DIR} | wc -l)
          if [ "$file_count" -eq 0 ]; then
            echo "No files generated"
            exit 1
          fi

      # 4. Deploy (isolated artifact publishing)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.OUTPUT_DIR }}
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
